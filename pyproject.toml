[project]
name = "minicourse-multimodal"
version = "0.1.0"
description = "Step-by-step multimodal (WSI + mpMRI + clinical) survival-prediction minicourse, based on HIMF-Surv / CHIMERA challenge Task 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "openslide-python>=1.3.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "nbformat>=5.9.0",
    # Needed starting in notebook 02 (feature extraction) and later:
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "simpleitk>=2.3.0",
    "einops>=0.6.0",
    "vit-pytorch>=0.43.0",
    "huggingface-hub>=0.16.0",
    "pytorch-lightning>=2.0.0",
    "lifelines>=0.27.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "openslide-bin>=4.0.1.2",
    "wandb>=0.28.0",
]

[tool.uv]
package = false
